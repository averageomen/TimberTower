name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      default_server_url:
        description: 'Optional default NAS/backend URL baked into the .exe (e.g. http://192.168.1.50:3001)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install client dependencies
        run: npm --prefix client install

      - name: Build Windows portable & installer .exe
        env:
          VITE_SERVER_URL: ${{ inputs.default_server_url || vars.JENGA_SERVER_URL }}
        run: npm --prefix client run build:exe

      - name: Upload .exe build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TimberStack-Jenga-Windows-EXE
          path: |
            client/release/TimberStack-Jenga-Portable.exe
            client/release/TimberStack-Jenga-Setup-*.exe

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            client/release/TimberStack-Jenga-Portable.exe
            client/release/TimberStack-Jenga-Setup-*.exe
